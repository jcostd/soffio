<!DOCTYPE html>
<html lang="{{ if .Meta.lang }}{{ .Meta.lang }}{{ else }}en{{ end }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>
    {{ if .Meta.author }}<meta name="author" content="{{ .Meta.author }}">{{ end }}
    <style>
     body {
       font-family: serif;
       line-height: 1.5;
       color: #222;
       background: #fff;
       max-width: 65ch;
       margin: 2rem auto;
       padding: 0 1rem;
     }
     @media (prefers-color-scheme: dark) {
       body { color: #eee; background: #111; }
       a { color: #88c; }
     }
     header, footer { font-family: sans-serif; font-size: 0.9rem; }
     header { margin-bottom: 2rem; border-bottom: 1px solid #ccc; }
     footer { margin-top: 4rem; border-top: 1px solid #ccc; color: #777; }
     h1, h2, h3 { line-height: 1.2; }
     img { max-width: 100%; height: auto; }
     figure { margin: 1.5rem 0; }
     figcaption { font-size: 0.85rem; font-style: italic; margin-top: 0.5rem; }
     /* Footnotes */
     section[role="doc-endnotes"] { font-size: 0.9rem; border-top: 1px solid #eee; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <header>
      <nav><a href="index.html">index</a></nav>
    </header>

    <main>
      <article>
	<h1>{{ .Title }}</h1>
	{{ if .Meta.date }}<aside><time>{{ .Meta.date }}</time></aside>{{ end }}

	<section>
          {{ .Content }}
	</section>
      </article>
    </main>

    <footer>
      <p>Generated by <a href="https://github.com/jcostd/soffio">Soffio</a>.</p>
    </footer>
  </body>
</html>
