<!DOCTYPE html>
<html lang="{{ if .Meta.language }}{{ .Meta.language }}{{ else }}it{{ end }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Soffio</title>
    {{ if .Meta.author }}<meta name="author" content="{{ .Meta.author }}">{{ end }}
    <style>
     :root {
       --bg: #ffffff;
       --fg: #111111;
       --link: #0055cc;
       --border: #eeeeee;
     }
     @media (prefers-color-scheme: dark) {
       :root {
         --bg: #1a1a1a;
         --fg: #e0e0e0;
         --link: #66b3ff;
         --border: #333333;
       }
     }
     body {
       font-family: system-ui, -apple-system, sans-serif;
       line-height: 1.6;
       color: var(--fg);
       background: var(--bg);
       max-width: 70ch;
       margin: 0 auto;
       padding: 2rem 1rem;
     }
     a { color: var(--link); text-decoration: none; }
     a:hover { text-decoration: underline; }
     img { max-width: 100%; height: auto; display: block; margin: 1.5rem 0; }
     figure { margin: 0; }
     figcaption { font-size: 0.9em; color: gray; margin-top: 0.5rem; }
     .site-header { margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
     .site-footer { margin-top: 3rem; border-top: 1px solid var(--border); padding-top: 1rem; font-size: 0.85em; color: gray; }
     .meta { font-size: 0.9em; color: gray; margin-bottom: 2rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav>
        <a href="index.html" class="brand">← Home</a>
      </nav>
    </header>

    <main id="main-content">
      <article class="h-entry">
        <header>
          <h1 class="p-name">{{ .Title }}</h1>
          <div class="meta">
            {{ if .Meta.date }}<time class="dt-published">{{ .Meta.date }}</time>{{ end }}
            {{ if .Meta.category }}&middot; <span class="p-category">{{ .Meta.category }}</span>{{ end }}
          </div>
        </header>

        <div class="e-content">
          {{ .Content }}
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>Generato con Soffio.</p>
    </footer>
  </body>
</html>
